<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEKA KAWIÇO - Cursos Técnicos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <style>
        :root{--primary-blue:#004a80;--secondary-blue:#007bff;--text-dark:#333;--text-light:#f4f4f4;--bg-light:#f9f9f9;--bg-dark:#2c3e50;--border-color:#ddd;--btn-bg:#007bff;--btn-hover:#0056b3;--online-color:#28a745;--offline-color:#ffc107}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;line-height:1.6;color:var(--text-dark);background:var(--bg-light)}
       .container{max-width:1200px;margin:0 auto;padding:0 20px}
        main.container{background:#fff;padding-bottom:40px}
        header{background:var(--primary-blue);color:var(--text-light);padding:15px 0;box-shadow:0 2px 10px rgba(0,0,0,.1);position:sticky;top:0;z-index:1000}
        header.container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
       .logo a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-light)}
       .logo img{height:50px}
       .logo h1{font-size:1.8em;font-weight:700;margin:0}
       .logo span{font-size:.9em;color:#cbd6e0}
       .menu-status-wrapper{display:flex;align-items:center;gap:20px}
        nav ul{list-style:none;display:flex;align-items:center;flex-wrap:wrap;justify-content:center}
        nav ul li{margin-left:20px;margin-top:5px}
        nav ul li a{color:var(--text-light);text-decoration:none;font-weight:600;font-size:1.05em}
        #status-indicator{display:flex;align-items:center;color:var(--text-light);cursor:pointer}
       .status-icon{font-size:1.5em;margin-right:5px}
       .status-icon.online{color:var(--online-color)}.status-icon.offline{color:var(--offline-color)}
       .hero{position:relative;height:40vh;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-light)}
       .hero-slide{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0;transition:opacity 1s}
       .hero-slide.active{opacity:1}
       .hero-slide h1{font-size:3em;margin-bottom:15px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
       .hero-slide p{font-size:1.2em;max-width:800px;margin:0 auto 20px;text-shadow:0 1px 5px rgba(0,0,0,.5)}
       .hero-slide.hero-btn{padding:12px 25px;background:var(--btn-bg);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none}
        #cursos{padding:80px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:30px}
       .curso-card{background:#fff;border-radius:12px;overflow:hidden;width:100%;max-width:320px;box-shadow:0 4px 15px rgba(0,0,0,.1);transition:transform.3s;display:flex;flex-direction:column}
       .curso-card:hover{transform:translateY(-5px)}
       .curso-card img{width:100%;height:180px;object-fit:cover}
       .curso-card.card-body{padding:15px;flex:1;display:flex;flex-direction:column}
       .curso-card h3{margin-bottom:10px;color:var(--primary-blue)}
       .curso-card p{flex:1;color:#555;font-size:.95em;margin-bottom:15px}
       .curso-card.btn-inscricao{display:block;text-align:center;padding:10px;border:none;border-radius:8px;background:var(--btn-bg);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;margin-top:10px}
       .social-share{display:flex;justify-content:space-between;gap:5px;margin-top:10px}
       .share-btn{flex-grow:1;padding:8px;border:none;border-radius:6px;cursor:pointer;font-weight:600;text-decoration:none;text-align:center}
       .share-whatsapp{background:#25D366;color:#fff}.share-facebook{background:#1877F2;color:#fff}.share-email{background:#f7d070;color:var(--text-dark)}
        footer{background:var(--bg-dark);color:var(--text-light);padding:20px 0;text-align:center}
    </style>
</head>
<body>
<header>
    <div class="container">
        <div class="logo"><a href="index.html"><img src="FK.png" alt="FK"><div><h1>FEKA KAWIÇO</h1><span>Cursos Técnicos</span></div></a></div>
        <div class="menu-status-wrapper"><nav><ul><li><a href="index.html">Início</a></li><li><a href="carreiras.html">Carreira</a></li><li><a href="#cursos">Cursos</a></li><li><a href="sobrenos.html">Sobre</a></li><li><a href="contato.html">Contato</a></li><li><a href="ajuda.html">Ajuda</a></li></ul></nav><div id="status-indicator"></div></div>
    </div>
</header>

<section class="hero" id="inicio">
    <div class="hero-slide active" style="background-image:url('https://picsum.photos/id/1024/1600/600');"><h1>O Futuro é Agora</h1><p>Prepare-se para liderar projetos complexos.</p><a href="#cursos" class="hero-btn">Ver Cursos</a></div>
</section>

<main class="container">
    <section id="cursos">
        <!-- CURSOS SERÃO CARREGADOS AUTOMATICAMENTE DO SUPABASE AQUI -->
        <p id="loading-cursos">Carregando cursos...</p>
    </section>
</main>

<footer><div class="container"><p>© 2025 FEKA KAWIÇO Cursos Técnicos</p></div></footer>

<script>
// ===== CONFIG AUTOMÁTICO =====
const IMAGE_MAP = {
    desenhador: "Armz.RHS.png", ingles: "Ingles.png", frances: "Frances.png",
    "QA-QC": "QA-QC.png", procurement: "Procuret.png", Robotica: "Introdução a Robotica.png",
    refrigeracao: "RefrigeracaoAC.jpg", REPARARTV: "ReparacaoTV.jpg", AutoNmicra: "NissanMicra.jpg",
    Curso_DJ: "DiscoJokerDJ.jpg", violao: "CursoViolao.jpg", vfd: "CursoVFD.jpg",
    TComercial: "TComercial.png", GComercial: "GComercial.png"
};
const PAGE_MAP = {
    desenhador: "tdpm.html", procurement: "curso-procurement.html", ingles: "ingles.html",
    frances: "frances.html", "QA-QC": "QA-QC.html", Robotica: "curso_robotica.html",
    refrigeracao: "curso-refrigeracao.html", REPARARTV: "curso-ManTV.html",
    AutoNmicra: "curso-Auto-Nmicra.html", violao: "curso-Violao_html.html",
    vfd: "curso-VFD.html", Curso_DJ: "Curso_DJ.html",
    TComercial: "TComercial.html", GComercial: "GComercial.html"
};

// ===== CARREGAMENTO AUTOMÁTICO DE CURSOS DO SUPABASE =====
let CURSO_KEYS = [];
async function loadCourses() {
    const container = document.getElementById('cursos');
    const { data: courses, error } = await supabaseClient.from('courses').select('id, nome, descricao').eq('ativo', true).order('id');
    if (error ||!courses || courses.length===0) {
        container.innerHTML = "<p>Nenhum curso ativo encontrado.</p>";
        return;
    }
    CURSO_KEYS = courses.map(c => c.id);
    let html = "";
    courses.forEach(curso => {
        const img = IMAGE_MAP[curso.id] || "FK.png";
        html += `
        <div class="curso-card" data-curso="${curso.nome}" data-curso-key="${curso.id}">
            <a href="#" class="curso-link" onclick="iniciarCurso('${curso.id}', event)"><img src="${img}" alt="${curso.nome}" onerror="this.src='FK.png'"></a>
            <div class="card-body">
                <h3>${curso.nome}</h3>
                <p>${curso.descricao || ''}</p>
                <p id="${curso.id}ValidationStatus" style="font-weight:bold;margin-top:10px;"></p>
                <a href="#" class="btn btn-inscricao course-btn" onclick="iniciarCurso('${curso.id}', event)">Inscrever</a>
                <div class="social-share">
                    <button class="share-btn share-whatsapp" onclick="shareCourse('whatsapp', this)"><i class="fab fa-whatsapp"></i></button>
                    <button class="share-btn share-facebook" onclick="shareCourse('facebook', this)"><i class="fab fa-facebook"></i></button>
                    <button class="share-btn share-email" onclick="shareCourse('email', this)"><i class="fas fa-envelope"></i> Enviar</button>
                </div>
            </div>
        </div>`;
    });
    container.innerHTML = html;
    await updateUI();
}

async function iniciarCurso(courseKey, e) {
    e.preventDefault();
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { alert('⚠️ Faça Login para acessar.'); window.location.href='login.html'; return; }
    const { data: enrollment } = await supabaseClient.from('enrollments').select('status').eq('user_id', session.user.id).eq('course_id', courseKey).single();
    if (enrollment?.status === 'validado') {
        window.location.href = PAGE_MAP[courseKey] || courseKey+'.html';
    } else {
        window.location.href = 'validar-geral.html?curso='+courseKey;
    }
}

async function updateLoginStatus() {
    const el = document.getElementById('status-indicator');
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        const { data: profile } = await supabaseClient.from('profiles').select('nome').eq('id', session.user.id).single();
        const firstName = profile?.nome? profile.nome.split(' ')[0] : 'Usuário';
        el.innerHTML = `<a href="perfil.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;"><i class="fas fa-circle status-icon online"></i><span>Olá, ${firstName}</span></a> <a href="#" onclick="logout(event)" style="margin-left:10px;color:#ffc107;font-weight:bold;text-decoration:none;">(Sair)</a>`;
    } else {
        el.innerHTML = `<a href="login.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;"><i class="fas fa-circle status-icon offline"></i><span>Login</span></a>`;
    }
}
async function logout(e){ e.preventDefault(); await supabaseClient.auth.signOut(); window.location.href='index.html'; }

async function updateUI() {
    await updateLoginStatus();
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        CURSO_KEYS.forEach(key => {
            const s = document.getElementById(`${key}ValidationStatus`);
            const b = document.querySelector(`.curso-card[data-curso-key="${key}"].course-btn`);
            if (!s||!b) return;
            s.innerHTML='Status: ❌ Requer Login'; s.style.color='#dc3545'; b.textContent='Inscrever';
        });
        return;
    }
    const { data: enrollments } = await supabaseClient.from('enrollments').select('course_id, status').eq('user_id', session.user.id).in('course_id', CURSO_KEYS);
    const map={}; (enrollments||[]).forEach(en=>map[en.course_id]=en.status);
    CURSO_KEYS.forEach(key => {
        const s=document.getElementById(`${key}ValidationStatus`);
        const b=document.querySelector(`.curso-card[data-curso-key="${key}"].course-btn`);
        if(!s||!b) return;
        if(map[key]==='validado'){ s.innerHTML='Status: ✅ Validado'; s.style.color='#28a745'; b.textContent='Continuar Curso'; }
        else { s.innerHTML='Status: 🔓 Falta Validar'; s.style.color='#007bff'; b.textContent='Validar Código'; }
    });
}

function shareCourse(platform, btn){
    const publicBaseURL='https://alfredofeka.github.io/feka-kawico/';
    const card=btn.closest('.curso-card'); const title=card.getAttribute('data-curso');
    const url=publicBaseURL+'index.html#cursos'; const msg=`🚀 FEKA KAWIÇO - Curso ${title}: ${url}`;
    if(platform==='whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
    if(platform==='facebook') window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,'_blank');
    if(platform==='email') window.open(`mailto:?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(msg)}`,'_self');
}

document.addEventListener('DOMContentLoaded', loadCourses);
</script>
</body>
</html>
