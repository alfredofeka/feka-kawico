<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>O meu perfil - FEKA KAWIÇO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="certificado.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#333}
header{background:#0055a5;padding:12px 20px;display:flex;justify-content:space-between}header a{color:#fff;text-decoration:none;font-weight:bold}
main{max-width:720px;margin:20px auto;padding:0 14px}
.box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:14px}
.foto{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#dde3ea;display:block;margin:0 auto 10px}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin:4px 0 10px}
.btn{padding:9px 14px;border:0;border-radius:6px;background:#0055a5;color:#fff;cursor:pointer;font-weight:600}.btn.g{background:#28a745}.btn.s{padding:5px 10px;font-size:.85em}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:.92em}
.badge{padding:2px 9px;border-radius:10px;color:#fff;font-size:.75em;font-weight:700}
h3{margin-top:0;color:#004a80}
</style>
</head>
<body>
<header><a href="index.html">FEKA KAWIÇO</a><a href="validar-geral.html">Os meus cursos</a></header>
<main id="m"><p>A carregar...</p></main>
<script>
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES={aluno:['Aluno','#17a2b8'],professor:['Professor','#28a745'],professor_inspector:['Professor Inspector','#fd7e14'],secretaria:['Secretaria','#e83e8c'],administrador:['Administrador','#dc3545']};
let me,prof,CM={},certs=[];
async function init(){
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session){location.replace('login.html');return;}
 me=session.user;
 const [p,e,c,ct,pa]=await Promise.all([
  supabaseClient.from('profiles').select('*').eq('id',me.id).maybeSingle(),
  supabaseClient.from('enrollments').select('*').eq('user_id',me.id),
  supabaseClient.from('courses').select('id,nome'),
  supabaseClient.from('certificados').select('*').eq('user_id',me.id),
  supabaseClient.from('progresso_alunos').select('*').eq('email',me.email)]);
 prof=p.data||{};(c.data||[]).forEach(x=>CM[String(x.id)]=x.nome);certs=ct.data||[];
 const acc={};(pa.data||[]).forEach(x=>acc[x.curso]=x.ultimo_acesso);
 const r=ROLES[prof.role||'aluno']||ROLES.aluno;
 document.getElementById('m').innerHTML=`
 <div class="box"><img class="foto" id="img" src="${esc(prof.foto_url||'FK.png')}" onerror="this.onerror=null;this.src='FK.png'">
  <div style="text-align:center"><input type="file" id="file" accept="image/*" style="display:none" onchange="foto(this.files[0])"><button class="btn s" onclick="file.click()">Mudar foto</button>
  <div style="margin-top:8px"><span class="badge" style="background:${r[1]}">${r[0]}</span></div><div style="color:#666;font-size:.9em;margin-top:4px">${esc(me.email)}</div></div>
  <label>Nome</label><input id="nome" value="${esc(prof.nome||'')}"><label>Telefone</label><input id="tel" value="${esc(prof.telefone||'')}">
  <button class="btn g" onclick="guardar()">Guardar dados</button> <span id="msg" style="margin-left:8px;font-size:.9em"></span></div>
 <div class="box"><h3>Os meus cursos</h3>${(e.data||[]).map(x=>`<div class="f"><span>${esc(CM[String(x.course_id)]||x.course_id)}${x.modulo_atual!=null?' · Módulo '+x.modulo_atual:''}${acc[x.course_id]?'<br><small>Último acesso '+new Date(acc[x.course_id]).toLocaleDateString('pt-PT')+'</small>':''}</span><b style="color:${x.status==='validado'?'#28a745':'#007bff'}">${x.status==='validado'?'Validado':'Pendente'}</b></div>`).join('')||'<p>Ainda não tens inscrições.</p>'}</div>
 <div class="box"><h3>Os meus certificados</h3>${certs.map((x,i)=>`<div class="f"><span>${esc(CM[String(x.course_id)]||x.course_id)}<br><small>${new Date(x.emitido_em).toLocaleDateString('pt-PT')} · ${esc(x.codigo)}</small></span><button class="btn s g" onclick="ver(${i})">Ver / Imprimir</button></div>`).join('')||'<p>Ainda não tens certificados emitidos.</p>'}</div>`;
}
function ver(i){const w=window.open('','_blank');if(!w)return alert('Permite pop-ups para ver o certificado');const x=certs[i];abrirCertificado(w,x,prof.nome||'',CM[String(x.course_id)]||x.course_id);}
async function guardar(url){
 const {error}=await supabaseClient.rpc('atualizar_meu_perfil',{p_nome:document.getElementById('nome').value,p_telefone:document.getElementById('tel').value,p_foto:url||null});
 const m=document.getElementById('msg');m.style.color=error?'#a00000':'#28a745';m.textContent=error?'Erro: '+error.message:'Guardado ✓';
}
async function foto(f){
 if(!f)return;if(f.size>2*1024*1024)return alert('Foto até 2 MB');
 const path=`${me.id}/${Date.now()}.${(f.name.split('.').pop()||'jpg').toLowerCase()}`;
 const up=await supabaseClient.storage.from('fotos').upload(path,f,{upsert:true});
 if(up.error)return alert('Erro: '+up.error.message);
 const url=supabaseClient.storage.from('fotos').getPublicUrl(path).data.publicUrl;
 await guardar(url);document.getElementById('img').src=url;
}
init();
</script>
</body>
</html>
