<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Password - FEKA KAWIÇO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;margin:0;padding:0;color:#333;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#fff;padding:22px;border-radius:8px;border:1px solid #ddd;width:360px;box-shadow:0 8px 30px rgba(0,0,0,0.06)}
input{width:100%;padding:10px;margin-top:10px;border-radius:6px;border:1px solid #ccc;box-sizing:border-box}
button{width:100%;background:#0055a5;color:#fff;padding:10px;border:0;border-radius:6px;margin-top:12px;cursor:pointer;transition:background 0.3s;}
button:disabled{background:#9bbce4;cursor:not-allowed;}
button:hover:not(:disabled){background:#00407a}
.msg{display:none;padding:8px;border-radius:6px;margin-top:8px;text-align:center;font-weight:bold;}
.msg.error{background:#ffe0e0;color:#a00000}
.msg.success{background:#e0ffe0;color:#006600}
</style>
</head>
<body>
<div class="card">
  <h3>Definir Nova Password</h3>
  <form id="novaForm" style="display:none;">
    <input id="password" type="password" placeholder="Nova Password" required>
    <input id="password2" type="password" placeholder="Confirmar Nova Password" required>
    <button type="submit" id="novaBtn">Guardar Nova Password</button>
  </form>
  <div id="msg" class="msg"></div>
</div>

<script>
const form = document.getElementById('novaForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('novaBtn');

function mostraMsg(texto, tipo) {
  msg.textContent = texto;
  msg.className = 'msg ' + tipo;
  msg.style.display = 'block';
}

// O Supabase dispara este evento quando deteta o token de recuperação no link do email
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    form.style.display = 'block';
  }
});

// Se o link já foi processado antes deste listener ser anexado, verifica a sessão diretamente
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) form.style.display = 'block';
  else mostraMsg('A validar o link de recuperação... Se esta mensagem não desaparecer, o link pode ter expirado. Peça um novo em "Esqueci a password".', 'error');
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if (password !== password2) {
    mostraMsg('As passwords não coincidem.', 'error');
    return;
  }
  if (password.length < 6) {
    mostraMsg('A password deve ter pelo menos 6 caracteres.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'A guardar...';

  const { error } = await supabaseClient.auth.updateUser({ password });

  if (error) {
    mostraMsg('Erro: ' + error.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Guardar Nova Password';
    return;
  }

  mostraMsg('Password atualizada com sucesso! A redirecionar para o login...', 'success');
  form.style.display = 'none';
  setTimeout(() => { location.href = 'login.html'; }, 2000);
});
</script>
</body>
</html>
